name: Formal Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      lean_changed: ${{ steps.changes.outputs.lean }}
      rocq_changed: ${{ steps.changes.outputs.rocq }}
      agda_changed: ${{ steps.changes.outputs.agda }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check Gubin audit for unproved assumptions
      run: python3 scripts/check_gubin_audit.py

    - name: Test attempt structure checker
      run: python3 -m unittest scripts.test_check_attempt_structure -v

    - name: Test proof status checker
      run: python3 -m unittest scripts.test_check_proof_status -v

    - name: Test issue 624 completion gate
      run: python3 -m unittest experiments.issue624.test_completion experiments.issue624.test_completion_workflow -v

    - name: Test issue listing script
      run: python3 -m unittest scripts.test_list_issues -v

    - name: Check certified source boundary
      run: python3 scripts/check_proof_status.py

    - name: Check exact Gubin paper LP witness
      run: python3 experiments/issue578/check_paper_lp.py

    - name: Check Plotnikov refutation assumptions
      run: python3 -m unittest discover -s experiments/issue577 -p 'test_*.py' -v

    - name: Check semantic coverage of named refutations
      run: python3 -m unittest discover -s experiments/issue580 -p 'test_*.py' -v

    - name: Check issue 7 independence claims
      run: |
        python3 experiments/issue579/check_claims.py
        bash experiments/issue7/check_claims_mutations.sh

    - name: Check verification workflow regressions
      run: python3 -m unittest discover -s experiments/issue584 -p 'test_*.py' -v

    - name: Check issue 532 idea dossiers
      run: |
        python3 -m unittest discover -s experiments/issue532 -p 'test_*.py' -v
        python3 experiments/issue532/check_dossiers.py

    - name: Check Kardash 2-SAT counterexamples
      run: python3 -m unittest discover -s experiments/issue587 -p 'test_*.py' -v

    - name: Check DPLL SAT solver correctness
      run: python3 -m unittest discover -s experiments/sat_solvers -p 'test_*.py' -v

    - name: Check issue 588 audit inventory
      run: |
        python3 -m unittest discover -s experiments/issue588 -p 'test_*.py' -v
        python3 experiments/issue588/admission_inventory.py

    - name: Detect changed files
      id: changes
      run: |
        case "$GITHUB_EVENT_NAME" in
          push|workflow_dispatch)
            # Pushes and manual runs verify every configured prover.
            lean=true
            rocq=true
            agda=true
            ;;
          pull_request)
            if [ -z "${GITHUB_BASE_REF:-}" ]; then
              echo "::error::Pull request base ref is missing"
              exit 1
            fi
            if ! changed_files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" --); then
              echo "::error::Could not detect changed files"
              exit 1
            fi

            lean=false
            rocq=false
            agda=false
            if grep -Eq '\.lean$|(^|/)(lakefile\.lean|lean-toolchain|lake-manifest\.json)$|^experiments/issue575/check\.sh$|^CONTRIBUTING\.md$' <<< "$changed_files"; then
              lean=true
            fi
            if grep -Eq '\.v$|(^|/)_CoqProject$' <<< "$changed_files"; then
              rocq=true
            fi
            if grep -Eq '\.agda$' <<< "$changed_files"; then
              agda=true
            fi
            if grep -Eq '^\.github/workflows/verification\.yml$' <<< "$changed_files"; then
              lean=true
              rocq=true
              agda=true
            fi
            if grep -Eq '^scripts/(check_proof_status\.py|check_issue624_completion\.py|proof_status\.json)$' <<< "$changed_files"; then
              lean=true
              rocq=true
            fi
            ;;
          *)
            echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
            exit 1
            ;;
        esac

        printf 'lean=%s\nrocq=%s\nagda=%s\n' "$lean" "$rocq" "$agda" >> "$GITHUB_OUTPUT"
        printf 'Verification selection: Lean=%s Rocq=%s Agda=%s\n' "$lean" "$rocq" "$agda"

  lean-verification:
    name: Lean Historical Compilation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.lean_changed == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Elan (Lean version manager)
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Cache Lean toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/.elan
        key: ${{ runner.os }}-lean-elan-v3-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean') }}
        restore-keys: |
          ${{ runner.os }}-lean-elan-v3-${{ hashFiles('lean-toolchain') }}-

    - name: Verify Lean installation
      run: |
        lean --version
        lake --version

    - name: Clean stale build artifacts
      run: |
        # Always clean .lake directory to ensure fresh build with current sources
        # This prevents stale compiled artifacts from causing build failures
        echo "Cleaning .lake directory for fresh build..."
        rm -rf .lake

    - name: Build and test Lean
      run: |
        if [ -f "lakefile.lean" ]; then
          echo "=== Lean Verification ==="
          lean --version
          echo ""
          bash experiments/issue575/check.sh
          echo "Building Lean project..."
          lake build
          echo "✓ Lean historical sources compile successfully!"
          echo ""
          python3 -m unittest experiments.issue614.test_framework -v
          bash experiments/issue586/check.sh
          python3 experiments/issue585/check_guidance.py
          lake env lean experiments/issue574/PolynomialRegression.lean
          lake env lean experiments/issue567/DecoderRegression.lean
          lean experiments/issue7_shoenfield_absoluteness.lean
          lean experiments/issue7_undecidability_formalization.lean
          lake env lean experiments/issue572/Independent.lean
          lake env lean experiments/issue568/TraceRegression.lean
          lake env lean experiments/issue624/CertificateRegression.lean
          lake env lean experiments/issue624/WindowRegression.lean
          lake env lean experiments/issue624/CNFRegression.lean
          lake env lean experiments/issue624/EmitterRegression.lean
          lake env lean experiments/issue624/CircuitCNFRegression.lean
          lake env lean experiments/issue624/MachineCNFRegression.lean
          lake env lean experiments/issue624/SuccessorRegression.lean
          lake env lean experiments/issue624/RunCNFRegression.lean
          lake env lean experiments/issue624/TableauCNFRegression.lean
          python3 experiments/issue532_vacuity/check.py
          bash experiments/issue571/check.sh
          if lake_test_output=$(lake test 2>&1); then
            printf '%s\n' "$lake_test_output"
          elif [[ "$lake_test_output" =~ ^error:\ .+:\ no\ test\ driver\ configured$ ]]; then
            echo "No Lake test driver configured"
          else
            printf '%s\n' "$lake_test_output" >&2
            exit 1
          fi
          python3 experiments/issue570/check_contradiction.py --lean
          bash experiments/issue573/check.sh --lean
          bash experiments/issue587/check.sh --lean
        else
          echo "✓ No Lean files - skipping"
        fi

  rocq-verification:
    name: Rocq Historical Compilation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rocq_changed == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for Rocq files
      id: check-rocq
      run: |
        if [ -f "_CoqProject" ] || find . -name "*.v" -print -quit | grep -q .; then
          echo "has_files=true" >> $GITHUB_OUTPUT
        else
          echo "has_files=false" >> $GITHUB_OUTPUT
          echo "✓ No Rocq files - skipping"
        fi

    - name: Fix permissions for docker
      if: steps.check-rocq.outputs.has_files == 'true'
      run: sudo chown -R 1000:1000 .

    - name: Build and test Rocq
      if: steps.check-rocq.outputs.has_files == 'true'
      uses: coq-community/docker-coq-action@v1
      with:
        custom_image: 'rocq/rocq-prover:9.0'
        custom_script: |
          set -e
          startGroup "Rocq version"
            rocq --version
          endGroup
          startGroup "Verify Rocq files"
            python3 -m unittest experiments.issue611.test_rocq_project -v
            rocq makefile -f _CoqProject -o Makefile.coq
            make -f Makefile.coq
            python3 experiments/issue570/check_contradiction.py --rocq
            bash experiments/issue573/check.sh --rocq
            bash experiments/issue587/check.sh --rocq
            echo "✓ Rocq historical sources compile successfully!"
          endGroup

    - name: Revert permissions
      if: ${{ always() && steps.check-rocq.outputs.has_files == 'true' }}
      run: sudo chown -R 1001:116 .

  certified-lean:
    name: Certified Lean Results
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.lean_changed == 'true'
    steps:
    - uses: actions/checkout@v4
    - name: Install Lean
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - name: Build and audit certified Lean results
      run: |
        lake build proofs.complexity.lean.Complexity \
          proofs.p_vs_np_decidable.lean.PSubsetNP \
          proofs.p_vs_np_decidable.lean.PvsNPDecidable \
          proofs.p_not_equal_np.lean.PNotEqualNP \
          proofs.experiments.issue532.lean.Idea01 \
          proofs.experiments.issue532.lean.Idea36 \
          proofs.experiments.issue568.lean.Tableau \
          proofs.experiments.issue624.lean.VerifierTableau \
          proofs.experiments.issue624.lean.FixedWindow \
          proofs.experiments.issue624.lean.LocalCNF \
          proofs.experiments.issue624.lean.MachineCNF \
          proofs.experiments.issue624.lean.SuccessorCNF \
          proofs.experiments.issue624.lean.RunCNF \
          proofs.experiments.issue624.lean.InitialCNF \
          proofs.experiments.issue624.lean.CookLevin \
          proofs.experiments.issue624.lean.CircuitCNF \
          proofs.experiments.issue624.lean.ConstantEmitter \
          proofs.experiments.issue609.lean.PEqualsNPAttempt \
          proofs.experiments.issue609.lean.KnownBarriers \
          proofs.experiments.issue532.lean.Idea41 \
          proofs.experiments.issue567.lean.ResidualKey \
          proofs.experiments.issue10.lean.NPNotSubsetP \
          proofs.experiments.issue8.lean.NPSubsetP \
          proofs.experiments.issue7.lean.ClockedSAT
        python3 scripts/check_proof_status.py --lean
        python3 experiments/issue624/check_tableau_contracts.py --lean
        python3 experiments/issue624/existing_bridge_probe.py --lean

  certified-rocq:
    name: Certified Rocq Results
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rocq_changed == 'true'
    steps:
    - uses: actions/checkout@v4
    - name: Fix permissions for docker
      run: sudo chown -R 1000:1000 .
    - name: Build and audit certified Rocq results
      uses: coq-community/docker-coq-action@v1
      with:
        custom_image: 'rocq/rocq-prover:9.0'
        custom_script: |
          set -e
          rocq compile -Q . '' proofs/complexity/rocq/Complexity.v
          rocq compile -Q . '' proofs/experiments/issue532/rocq/Machines.v
          rocq compile -Q . '' proofs/experiments/issue532/rocq/Idea36.v
          rocq compile -Q . '' proofs/experiments/issue532/rocq/SATVerifier.v
          rocq compile -Q . '' proofs/experiments/issue532/rocq/Idea01.v
          rocq compile -Q . '' proofs/experiments/issue568/rocq/Tableau.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/CertificateCNF.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/VerifierTableau.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/FixedWindow.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/LocalCNF.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/MachineCNF.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/SuccessorCNF.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/RunCNF.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/InitialCNF.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/CookLevin.v
          rocq compile -Q . '' proofs/experiments/issue532/rocq/Circuits.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/CircuitCNF.v
          rocq compile -Q . '' proofs/experiments/issue624/rocq/ConstantEmitter.v
          rocq compile -Q . '' proofs/p_vs_np_decidable/rocq/PSubsetNP.v
          rocq compile -Q . '' proofs/p_vs_np_decidable/rocq/PvsNPDecidable.v
          rocq compile -Q . '' proofs/p_not_equal_np/rocq/PNotEqualNP.v
          rocq compile -Q . '' proofs/experiments/issue609/rocq/PEqualsNPAttempt.v
          rocq compile -Q . '' proofs/experiments/issue609/rocq/KnownBarriers.v
          rocq compile -Q . '' proofs/experiments/issue532/rocq/Idea16.v
          rocq compile -Q . '' proofs/experiments/issue532/rocq/Idea41.v
          rocq compile -Q . '' proofs/experiments/issue567/rocq/ResidualKey.v
          rocq compile -Q . '' proofs/experiments/issue10/rocq/NPNotSubsetP.v
          rocq compile -Q . '' proofs/experiments/issue8/rocq/NPSubsetP.v
          rocq compile -Q . '' proofs/experiments/issue7/rocq/ClockedSAT.v
          python3 scripts/check_proof_status.py --rocq
          python3 experiments/issue624/check_tableau_contracts.py --rocq
          python3 experiments/issue624/existing_bridge_probe.py --rocq
    - name: Revert permissions
      if: always()
      run: sudo chown -R 1001:116 .

# Isabelle verification removed - proofs archived to ./archive/isabelle/
# See https://github.com/konard/p-vs-np/issues/530

  agda-verification:
    name: Agda Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.agda_changed == 'true'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Check shared complexity formalizations
      run: |
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
          ghcr.io/codewars/agda@sha256:d56bf738f23befbd02352bd207483bbefe513de612683747ebc35675549e9d0e \
          sh -c '
            set -e
            agda -i . proofs/complexity/agda/Complexity.agda
            agda -i . proofs/p_vs_np_decidable/agda/PSubsetNP.agda
            agda -i . proofs/p_vs_np_decidable/agda/PvsNPDecidable.agda
            agda -i . proofs/p_not_equal_np/agda/PNotEqualNP.agda
            agda -i . proofs/p_vs_np_undecidable/agda/PvsNPUndecidable.agda
            agda -i . experiments/issue572/Independent.agda
          '

  issue624-completion:
    name: Issue 624 Completion
    runs-on: ubuntu-latest
    # This job deliberately has no dependency on change detection. Even a
    # documentation-only update must check the full endpoint on this PR.
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.number == 630 || github.head_ref == 'issue-624-0b9b9b6c5d75')) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'issue-624-0b9b9b6c5d75')
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Require complete issue 624 sources and manifest entries
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ci-logs
        python3 scripts/check_issue624_completion.py 2>&1 | tee ci-logs/issue624-completion-preflight.log
    - name: Install Lean
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - name: Check complete Lean contracts and assumptions
      shell: bash
      run: |
        set -euo pipefail
        lake build
        python3 experiments/issue624/check_completion_kernels.py --lean
        python3 experiments/issue624/check_completion_types.py --lean
        python3 scripts/check_issue624_completion.py --lean 2>&1 | tee ci-logs/issue624-completion-lean.log
        python3 scripts/check_proof_status.py --lean
    - name: Fix permissions for docker
      run: sudo chown -R 1000:1000 .
    - name: Check complete Rocq contracts and assumptions
      uses: coq-community/docker-coq-action@v1
      with:
        custom_image: 'rocq/rocq-prover:9.0'
        custom_script: |
          set -euo pipefail
          rocq makefile -f _CoqProject -o Makefile.coq
          make -f Makefile.coq
          python3 experiments/issue624/check_completion_kernels.py --rocq
          python3 experiments/issue624/check_completion_types.py --rocq
          python3 scripts/check_issue624_completion.py --rocq 2>&1 | tee ci-logs/issue624-completion-rocq.log
          python3 scripts/check_proof_status.py --rocq
    - name: Revert permissions
      if: always()
      run: sudo chown -R 1001:116 .
    - name: Preserve completion diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: issue624-completion-diagnostics
        path: ci-logs/issue624-completion-*.log
        if-no-files-found: error

  summary:
    name: Verification Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, lean-verification, rocq-verification, certified-lean, certified-rocq, agda-verification, issue624-completion]
    if: always()
    env:
      ISSUE624_REQUIRED: >-
        ${{ (github.event_name == 'pull_request' &&
             (github.event.pull_request.number == 630 || github.head_ref == 'issue-624-0b9b9b6c5d75')) ||
            (github.event_name == 'workflow_dispatch' && github.ref_name == 'issue-624-0b9b9b6c5d75') }}

    steps:
    - name: Summary
      run: |
        echo "## Formal Verification Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

        DETECT_RESULT="${{ needs.detect-changes.result }}"
        LEAN_RESULT="${{ needs.lean-verification.result }}"
        ROCQ_RESULT="${{ needs.rocq-verification.result }}"
        CERT_LEAN_RESULT="${{ needs.certified-lean.result }}"
        CERT_ROCQ_RESULT="${{ needs.certified-rocq.result }}"
        AGDA_RESULT="${{ needs.agda-verification.result }}"
        ISSUE624_RESULT="${{ needs.issue624-completion.result }}"

        echo "| Change detection | $DETECT_RESULT |" >> $GITHUB_STEP_SUMMARY

        # Show skipped status if no files changed
        if [ "$LEAN_RESULT" = "skipped" ]; then
          echo "| Lean historical compilation | skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Lean historical compilation | $LEAN_RESULT |" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "$ROCQ_RESULT" = "skipped" ]; then
          echo "| Rocq historical compilation | skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Rocq historical compilation | $ROCQ_RESULT |" >> $GITHUB_STEP_SUMMARY
        fi

        echo "| Certified Lean result audit | $CERT_LEAN_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| Certified Rocq result audit | $CERT_ROCQ_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| Issue 624 completion | $ISSUE624_RESULT |" >> $GITHUB_STEP_SUMMARY

        if [ "$AGDA_RESULT" = "skipped" ]; then
          echo "| Agda | skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Agda | $AGDA_RESULT |" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        case "$GITHUB_EVENT_NAME" in
          push) echo "_Push to main: ran every configured verification job_" >> $GITHUB_STEP_SUMMARY ;;
          workflow_dispatch) echo "_Manual run: ran every configured verification job_" >> $GITHUB_STEP_SUMMARY ;;
          pull_request) echo "_Pull request: ran verification jobs for languages with modified files_" >> $GITHUB_STEP_SUMMARY ;;
        esac
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "_Note: Isabelle proofs archived to ./archive/isabelle/_" >> $GITHUB_STEP_SUMMARY
        echo "_Agda checks cover the shared complexity formalizations._" >> $GITHUB_STEP_SUMMARY
        echo "_Historical attempts are compiled only. Certified Lean and Rocq conclusions are listed in scripts/proof_status.json and checked for unapproved assumptions._" >> $GITHUB_STEP_SUMMARY

    - name: Check results
      run: |
        DETECT_RESULT="${{ needs.detect-changes.result }}"
        LEAN_RESULT="${{ needs.lean-verification.result }}"
        ROCQ_RESULT="${{ needs.rocq-verification.result }}"
        CERT_LEAN_RESULT="${{ needs.certified-lean.result }}"
        CERT_ROCQ_RESULT="${{ needs.certified-rocq.result }}"
        AGDA_RESULT="${{ needs.agda-verification.result }}"
        ISSUE624_RESULT="${{ needs.issue624-completion.result }}"

        if [[ "${ISSUE624_REQUIRED:-false}" = "true" && "$ISSUE624_RESULT" != "success" ]]; then
          echo "::error::Issue 624 completion did not pass ($ISSUE624_RESULT)"
          exit 1
        fi

        if [ "$DETECT_RESULT" != "success" ]; then
          echo "::error::Change detection failed ($DETECT_RESULT)"
          exit 1
        fi

        # Consider 'success' and 'skipped' as passing
        if [[ "$LEAN_RESULT" != "success" && "$LEAN_RESULT" != "skipped" ]]; then
          echo "::error::Lean verification failed"
          exit 1
        fi

        if [[ "$ROCQ_RESULT" != "success" && "$ROCQ_RESULT" != "skipped" ]]; then
          echo "::error::Rocq verification failed"
          exit 1
        fi

        if [[ "$CERT_LEAN_RESULT" != "success" && "$CERT_LEAN_RESULT" != "skipped" ]]; then
          echo "::error::Certified Lean audit failed"
          exit 1
        fi

        if [[ "$CERT_ROCQ_RESULT" != "success" && "$CERT_ROCQ_RESULT" != "skipped" ]]; then
          echo "::error::Certified Rocq audit failed"
          exit 1
        fi

        if [[ "$AGDA_RESULT" != "success" && "$AGDA_RESULT" != "skipped" ]]; then
          echo "::error::Agda verification failed"
          exit 1
        fi

        echo "✓ All verification checks passed (or skipped due to no changes)"
