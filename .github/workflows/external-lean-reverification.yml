# Issue #638: independent re-verification of the AI-lab Lean developments on
# the Exponential Time Hypothesis, run on GitHub runners rather than locally.
#
# Every upstream repository is pinned to the commit archived under
# docs/case-studies/issue-638/sources/.  Each job first checks that the trusted
# statement files at that commit are byte-identical to the archived copies, so
# the case study and the checked statements cannot drift apart.
#
# The verifier scripts that are run from the upstream checkout
# (.github/scripts/comparator-check.sh and <project>/scripts/PrintAxioms.lean of
# anthropics/formal-math) are archived too, under
# docs/case-studies/issue-638/sources/anthropic-formal-math-ci/, and are
# diffed against the checkout before they run.  Every #print axioms log must
# be non-empty and must name the theorems it is meant to cover.
#
# * anthropic-eth        anthropics/formal-math eth/: full build, #print axioms,
#                        and Comparator (with lean4export, nanoda and landrun)
#                        through the upstream script .github/scripts/comparator-check.sh
# * anthropic-3sum-apsp  the same for 3sum-apsp/ (same repository and commit)
# * openai-statement     openai/math: elaborate only the trusted challenge
#                        statement ComparatorChallenges/SubexponentialSAT.lean
#                        against the pinned Mathlib (cheap; must pass)
# * openai-full          openai/math: build OAI.Algorithms.SubexponentialSAT.Main
#                        (12014 build jobs; a cold build took 2 h 40 min and
#                        almost all of the runner's 16 GB of memory in run
#                        41570704897, and nanoda then needs about 4 hours),
#                        print axioms, run Comparator.  It runs only on
#                        workflow_dispatch.  It is continue-on-error, so a
#                        green run of the whole workflow does NOT mean that it
#                        passed: read the job's own conclusion and summary.  The
#                        package build directory is cached under one fixed key
#                        per pinned commit, so a later dispatch resumes or
#                        reuses an earlier build (Comparator re-checks the
#                        exported terms in both kernels either way).
name: External Lean re-verification (issue 638)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/external-lean-reverification.yml'
      - 'docs/case-studies/issue-638/sources/**'
      - 'experiments/issue638/check_axioms_log.sh'
      - 'experiments/issue638/test_check_axioms_log.sh'
  schedule:
    # Monthly, so that a pinned upstream build that stops working is noticed
    # without spending runner hours every week.  openai-full is not scheduled.
    - cron: '17 4 1 * *'

permissions:
  contents: read

defaults:
  run:
    # An explicit `bash` makes GitHub run `bash -eo pipefail`, so that
    # `lake build ... | tee ...` fails when the build fails.
    shell: bash

concurrency:
  # One group per event: a new push cancels an older pull_request run, but a
  # push never cancels a manual dispatch (openai-full takes up to six hours of
  # runner time), and a second dispatch waits for the first.
  group: external-lean-reverification-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANTHROPIC_REPO: https://github.com/anthropics/formal-math.git
  ANTHROPIC_COMMIT: 16a5ce41304fcdaea4e0be7c132e1c361dc26da5
  OPENAI_REPO: https://github.com/openai/math.git
  OPENAI_COMMIT: 4eaee87548250b2682affda7d05d947c05554bae
  OPENAI_MATHLIB: d13f23b723b8a846827a245b89c10fc7d3f11612
  ELAN_INIT: https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh
  ARCHIVE: docs/case-studies/issue-638/sources

jobs:
  anthropic:
    name: anthropic-${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: eth
            archive: anthropic-formal-math-eth
            trusted: MainResults.lean Challenge.lean comparator.json lakefile.toml lean-toolchain
            # Theorems that the upstream scripts/PrintAxioms.lean must report on.
            theorems: MainResults.ethIsFalse MainResults.mainTheorem
          - project: 3sum-apsp
            archive: anthropic-formal-math-3sum-apsp
            trusted: EndStatement.lean comparator-endstatement.json comparator-paperstatements.json lakefile.toml lean-toolchain
            theorems: ThreeSumApsp.endStatement_theorem_19
    steps:
      - uses: actions/checkout@v4

      - name: Fetch anthropics/formal-math at the pinned commit
        run: |
          git init -q upstream
          git -C upstream remote add origin "$ANTHROPIC_REPO"
          git -C upstream fetch -q --depth 1 origin "$ANTHROPIC_COMMIT"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$ANTHROPIC_COMMIT"

      - name: Trusted files match the archived copies
        run: |
          for f in ${{ matrix.trusted }}; do
            diff -u "$ARCHIVE/${{ matrix.archive }}/$f" "upstream/${{ matrix.project }}/$f"
            echo "identical: ${{ matrix.project }}/$f"
          done

      - name: Verifier scripts match the archived copies
        run: |
          for f in .github/scripts/comparator-check.sh ${{ matrix.project }}/scripts/PrintAxioms.lean; do
            diff -u "$ARCHIVE/anthropic-formal-math-ci/$f" "upstream/$f"
            echo "identical: $f"
          done
          bash experiments/issue638/test_check_axioms_log.sh

      - name: Install elan
        run: |
          curl -sSfL "$ELAN_INIT" | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib cache
        working-directory: upstream/${{ matrix.project }}
        run: |
          lean --version
          lake exe cache get

      - name: Build the project
        working-directory: upstream/${{ matrix.project }}
        run: lake build 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 40

      - name: Print axioms
        working-directory: upstream/${{ matrix.project }}
        run: |
          lake env lean scripts/PrintAxioms.lean 2>&1 | tee "$RUNNER_TEMP/axioms.log"
          # Non-empty, one report per `#print axioms`, the named theorems
          # present, and only propext, Classical.choice and Quot.sound.
          bash "$GITHUB_WORKSPACE/experiments/issue638/check_axioms_log.sh" "$RUNNER_TEMP/axioms.log" \
            "$(grep -c '^#print axioms ' scripts/PrintAxioms.lean)" ${{ matrix.theorems }}

      - name: Comparator (lean4export + nanoda + landrun)
        working-directory: upstream/${{ matrix.project }}
        env:
          LOG_DIR: ${{ runner.temp }}/comparator-logs
        run: bash ../.github/scripts/comparator-check.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### anthropics/formal-math ${{ matrix.project }} @ $ANTHROPIC_COMMIT"
            echo '```'
            cat "$RUNNER_TEMP/axioms.log" 2>/dev/null || echo "(no axioms log)"
            grep -h -E "Your solution is okay!|error" "$RUNNER_TEMP"/comparator-logs/*.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-${{ matrix.project }}-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/comparator-logs/
          if-no-files-found: ignore

  openai-statement:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch openai/math at the pinned commit
        run: |
          git init -q upstream
          git -C upstream remote add origin "$OPENAI_REPO"
          git -C upstream fetch -q --depth 1 origin "$OPENAI_COMMIT"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$OPENAI_COMMIT"

      - name: Trusted files match the archived copies
        run: |
          for f in ComparatorChallenges/SubexponentialSAT.lean ComparatorChallenges/SubexponentialSAT.json; do
            diff -u "$ARCHIVE/openai-math/lean/$f" "upstream/lean/$f"
            echo "identical: lean/$f"
          done
          grep -qx 'leanprover/lean4:v4.34.1' upstream/lean/lean-toolchain
          grep -q "\"rev\": \"$OPENAI_MATHLIB\"" upstream/lean/lake-manifest.json

      - name: Install elan
        run: |
          curl -sSfL "$ELAN_INIT" | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Elaborate the challenge statement against the pinned Mathlib
        run: |
          mkdir -p stmt/ComparatorChallenges
          cp upstream/lean/lean-toolchain stmt/
          cp upstream/lean/ComparatorChallenges/SubexponentialSAT.lean stmt/ComparatorChallenges/
          cat > stmt/lakefile.toml <<EOF
          name = "stmt"

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4"
          rev = "$OPENAI_MATHLIB"

          [[lean_lib]]
          name = "ComparatorChallenges"
          globs = ["ComparatorChallenges.SubexponentialSAT"]
          EOF
          cat > stmt/Check.lean <<'EOF'
          import ComparatorChallenges.SubexponentialSAT
          #check @OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.exact_count_and_sat
          #print axioms OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.exact_count_and_sat
          EOF
          cd stmt
          lake update
          lake exe cache get
          lake build ComparatorChallenges.SubexponentialSAT 2>&1 | tee "$RUNNER_TEMP/statement.log"
          lake env lean Check.lean 2>&1 | tee -a "$RUNNER_TEMP/statement.log"
          # The challenge is a statement with `sorry` and nothing else.
          grep -q "sorryAx" "$RUNNER_TEMP/statement.log"
          # Lean prints `declaration uses `sorry`` (backticks; older versions used quotes).
          grep -qE "declaration uses .sorry." "$RUNNER_TEMP/statement.log"
          # Every sorry warning must come from the challenge file.
          ! grep -E "declaration uses .sorry." "$RUNNER_TEMP/statement.log" | grep -v "ComparatorChallenges/SubexponentialSAT.lean"

      - name: Summary
        if: always()
        run: |
          {
            echo "### openai/math challenge statement @ $OPENAI_COMMIT"
            echo '```'
            tail -n 60 "$RUNNER_TEMP/statement.log" 2>/dev/null || echo "(no statement log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  openai-full:
    runs-on: ubuntu-24.04
    # Manual only (`gh workflow run external-lean-reverification.yml --ref
    # <branch>`): a run costs several hours of runner time, so pushes and the
    # monthly schedule do not start it.
    if: github.event_name == 'workflow_dispatch'
    # continue-on-error: a failure or time-out here is reported as "blocked"
    # in the case study, not as a refutation.  It also means that the run as
    # a whole is green even when this job fails, so the case study quotes this
    # job's own conclusion and log lines, never the run's overall status.
    continue-on-error: true
    timeout-minutes: 355
    needs: openai-statement
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Raise vm.max_map_count (see openai/math lean/README.md)
        run: sudo sysctl -w vm.max_map_count=1048576

      # Run 41553031734 lost its runner ("received a shutdown signal") after
      # 2.5 hours of `lake build`, with no log of the cause.  A large swap file
      # gives the 16 GB runner headroom if the cause was memory, and the
      # monitor in the build step records memory use either way.
      - name: Add swap space
        run: |
          sudo fallocate -l 32G /swapfile-oai
          sudo chmod 600 /swapfile-oai
          sudo mkswap /swapfile-oai
          sudo swapon /swapfile-oai
          swapon --show
          free -m

      - name: Fetch openai/math at the pinned commit
        run: |
          git init -q upstream
          git -C upstream remote add origin "$OPENAI_REPO"
          git -C upstream fetch -q --depth 1 origin "$OPENAI_COMMIT"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$OPENAI_COMMIT"
          find upstream/lean/OAI/Algorithms/SubexponentialSAT -name '*.lean' | wc -l

      - name: Install elan
        run: |
          curl -sSfL "$ELAN_INIT" | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch dependencies and the Mathlib cache
        working-directory: upstream/lean
        run: |
          lean --version
          lake exe cache get
          df -h /

      # Build outputs of the openai/math package itself (not Mathlib, which
      # comes from `lake exe cache get`).  Only workflows of this repository
      # can write this cache, and Comparator re-checks the exported proof terms
      # with the Lean kernel and nanoda, so a restored .olean cannot make a
      # wrong proof pass.  It lets a later run resume a build that did not
      # finish within one job.  One fixed key per pinned commit; the prefix
      # restore key also finds the older per-run keys
      # (openai-build-<commit>-<run id>-<attempt>).
      - name: Restore partial build
        id: restore-build
        uses: actions/cache/restore@v4
        with:
          path: upstream/lean/.lake/build
          key: openai-build-${{ env.OPENAI_COMMIT }}
          restore-keys: openai-build-${{ env.OPENAI_COMMIT }}

      - name: Build the SubexponentialSAT solution
        working-directory: upstream/lean
        timeout-minutes: 290
        env:
          GLIBC_TUNABLES: glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1
        run: |
          log="$RUNNER_TEMP/openai-build.log"
          : > "$log"
          # Every 5 minutes: memory, swap, free disk and the last progress line.
          # This goes to the job log as it happens, so it survives a lost runner.
          (
            while sleep 300; do
              mem=$(free -m | awk '/^Mem:/{printf "mem used %s of %s MB, available %s MB", $3, $2, $7} /^Swap:/{printf "; swap used %s of %s MB", $3, $2}')
              last=$(grep -aE '^(✔|✖|⚠) \[' "$log" | tail -n 1 | cut -c1-140)
              echo "[monitor $(date -u +%H:%M)] $mem; disk free $(df -h --output=avail / | tail -n 1 | tr -d ' '); $last"
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          # Stop cleanly before the step limit so the cache can still be saved.
          timeout -s INT 280m lake build OAI.Algorithms.SubexponentialSAT.Main 2>&1 \
            | tee "$log" | { grep --line-buffered -vE '^(✔|ℹ)' || true; }

      # A cache key cannot be overwritten, so save only when the fixed key was
      # not an exact hit (first run, or restored from an older per-run key).
      - name: Save partial build
        if: always() && steps.restore-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: upstream/lean/.lake/build
          key: openai-build-${{ env.OPENAI_COMMIT }}

      - name: Print axioms
        working-directory: upstream/lean
        run: |
          cat > "$RUNNER_TEMP/PrintAxioms.lean" <<'EOF'
          import OAI.Algorithms.SubexponentialSAT.Main
          #print axioms OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.exact_count_and_sat
          EOF
          lake env lean "$RUNNER_TEMP/PrintAxioms.lean" 2>&1 | tee "$RUNNER_TEMP/openai-axioms.log"
          bash "$GITHUB_WORKSPACE/experiments/issue638/check_axioms_log.sh" "$RUNNER_TEMP/openai-axioms.log" \
            1 OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.exact_count_and_sat

      - name: Comparator (lean4export + nanoda + landrun)
        working-directory: upstream/lean
        env:
          LOG_DIR: ${{ runner.temp }}/comparator-logs
        run: |
          git init -q "$RUNNER_TEMP/anthropic"
          git -C "$RUNNER_TEMP/anthropic" remote add origin "$ANTHROPIC_REPO"
          git -C "$RUNNER_TEMP/anthropic" fetch -q --depth 1 origin "$ANTHROPIC_COMMIT"
          git -C "$RUNNER_TEMP/anthropic" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/anthropic" rev-parse HEAD)" = "$ANTHROPIC_COMMIT"
          f=.github/scripts/comparator-check.sh
          diff -u "$GITHUB_WORKSPACE/$ARCHIVE/anthropic-formal-math-ci/$f" "$RUNNER_TEMP/anthropic/$f"
          echo "identical: $f"
          # The upstream script looks for comparator*.json next to the lakefile;
          # it forces enable_nanoda=true, which OpenAI's own config leaves off.
          cp ComparatorChallenges/SubexponentialSAT.json comparator-subexponentialsat.json
          # Run 41570704897: nanoda's main thread overflowed the default 8 MB
          # stack on this proof ("thread 'main' has overflowed its stack",
          # exit 134) while the Lean kernel accepted it.  The main-thread stack
          # of a process is bounded by RLIMIT_STACK, which is inherited through
          # comparator and landrun, so raise it here.  This changes resources
          # only; nanoda still has to accept the exported terms.
          ulimit -s unlimited 2>/dev/null || ulimit -s "$(ulimit -Hs)"
          echo "stack limit (KB): $(ulimit -s)"
          bash "$RUNNER_TEMP/anthropic/.github/scripts/comparator-check.sh"

      - name: Summary
        if: always()
        run: |
          {
            echo "### openai/math SubexponentialSAT full build @ $OPENAI_COMMIT"
            echo '```'
            grep -E "^(error|✖)|Build completed|build failed" "$RUNNER_TEMP/openai-build.log" 2>/dev/null | tail -n 20 || echo "(no build log)"
            grep -aE '^(✔|✖|⚠) \[' "$RUNNER_TEMP/openai-build.log" 2>/dev/null | tail -n 1 || true
            sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process" | tail -n 5 || true
            free -m
            cat "$RUNNER_TEMP/openai-axioms.log" 2>/dev/null || echo "(no axioms log)"
            grep -h -E "Your solution is okay!" "$RUNNER_TEMP"/comparator-logs/*.log 2>/dev/null || echo "(comparator did not accept or did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-full-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/comparator-logs/
          if-no-files-found: ignore
